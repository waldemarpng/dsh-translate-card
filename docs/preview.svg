<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="20" y="12" width="680" height="132" rx="16" fill="#171a21"/>
  <rect x="20.5" y="12.5" width="679" height="131" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="54" cy="46" r="13" fill="url(#badge)"/>
  <text x="54" y="50" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">AI</text>

  <text x="78" y="46" font-size="13.5" fill="#e6e8eb">Sure! The config tries each backend in order &#x2014;</text>
  <rect x="76" y="56" width="308" height="21" rx="4" fill="#60a5fa" fill-opacity="0.35"/>
  <text x="78" y="71" font-size="13.5" fill="#e6e8eb">the first one that streams a token wins.</text>
  <text x="78" y="106" font-size="11" fill="#8a93a1">llm &#xb7; openai &#xb7; google &#xb7; libretranslate &#xb7; bing</text>

  <path d="M384 80 L384 164" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g filter="url(#cardShadow)">
    <rect x="300" y="168" width="384" height="112" rx="14" fill="#ffffff"/>
    <rect x="300.5" y="168.5" width="383" height="111" rx="13.5" fill="none" stroke="#e8ecf1"/>
  </g>

  <rect x="316" y="180" width="24" height="18" rx="6" fill="url(#badge)"/>
  <text x="328" y="193" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">DE</text>
  <text x="348" y="193" font-size="11" fill="#6b7280">English &#x2192; German</text>

  <g stroke="#9ca3af" stroke-linecap="round" fill="none">
    <rect x="628.5" y="183.5" width="7" height="7" rx="1.5" stroke-width="1.2"/>
    <path d="M625.5 186.5v-4.5a1.5 1.5 0 0 1 1.5-1.5h4" stroke-width="1.2"/>
    <path d="M655 181.5a5.5 5.5 0 1 1-1.4-1" stroke-width="1.3"/>
    <path d="M655 178.5v3h-3" stroke-width="1.3"/>
    <path d="M668 181.5l6 6M674 181.5l-6 6" stroke-width="1.3"/>
  </g>

  <text x="316" y="224" font-size="13.5" fill="#1f2328">Der schnelle braune Fuchs springt &#xfc;ber den faulen Hund.</text>
  <text x="316" y="256" font-size="10.5" fill="#9ca3af">llm &#xb7; deepseek-v4-flash &#xb7; Esc to close</text>
</svg>
